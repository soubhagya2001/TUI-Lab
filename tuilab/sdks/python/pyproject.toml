[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tui-lab"
version = "0.1.0"
description = "Thin Python client for TUI Lab (sidecar over the tuilab binary)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/tuilab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
