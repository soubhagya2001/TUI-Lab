# TUI Lab self-test: search flow with a committed golden snapshot.
# Runs in CI via `tuilab run tests/e2e` (see .github/workflows/ci.yml).
schema: tui-lab/v1
name: search-flow
application:
  command: "cargo"
  args: ["run", "--manifest-path", "tests/fixtures/ratatui-sample/Cargo.toml"]
terminal:
  width: 120
  height: 40
steps:
  - wait_for_text:
      text: "TUI-LAB-SAMPLE"
      timeout: 30s
  - press: DOWN
  - press: ENTER
  - wait_for_text:
      text: "Selected: beta-chair"
  - press: ESC
  - wait_for_text:
      text: "TUI-LAB-SAMPLE"
  - press: "/"
  - type: "table"
  - wait_for_text:
      text: "Search: table"
  - assert_text:
      contains: "gamma-table"
  - assert_text:
      not_contains: "beta-chair"
  - snapshot:
      name: "search-table"
  - press: ESC
  # Settle lone-ESC before quit: crossterm resolves a bare ESC with a short
  # timeout, so an immediate `q` can coalesce into Alt+q (ignored) on Linux.
  # Sync via wait_for_text, never sleep (AGENTS.md §3).
  - wait_for_text:
      text: "TUI-LAB-SAMPLE"
  - press: q
assertions:
  - exit_code: 0
