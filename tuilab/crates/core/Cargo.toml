[package]
name = "tui-lab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tui-lab-protocol = { path = "../protocol" }
tui-lab-input = { path = "../input" }
tui-lab-pty = { path = "../pty" }
tui-lab-terminal = { path = "../terminal" }
tui-lab-runtime = { path = "../runtime" }
tui-lab-assertions = { path = "../assertions" }
tui-lab-snapshots = { path = "../snapshots" }
tokio = { version = "1", features = ["time", "rt", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tui-lab-pty = { path = "../pty" }
tui-lab-terminal = { path = "../terminal" }
tui-lab-input = { path = "../input" }
tui-lab-protocol = { path = "../protocol" }
tui-lab-runtime = { path = "../runtime" }
tui-lab-assertions = { path = "../assertions" }
tui-lab-snapshots = { path = "../snapshots" }
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "macros"] }
