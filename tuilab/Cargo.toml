[workspace]
resolver = "2"
members = ["crates/*", "sdks/rust"]
default-members = ["crates/*", "sdks/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Black-box testing platform for terminal applications (TUI Lab)"
repository = "https://github.com/soubhagya2001/TUI-Lab"
rust-version = "1.75"

[workspace.lints.rust]
warnings = "deny"

[profile.release]
strip = true

[workspace.metadata.dist]
# Release packaging (Phase 12). Binaries only; libraries/SDKs stay unpublished.
cargo-dist-version = "0.33.0"
ci = ["github"]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
# Archives only for v1 (no shell/powershell/npm installers yet).
installers = []
