# Web Guide — build check + GitHub Pages deploy.
#
# - PRs / pushes touching web-guide/** get a build-only check (no deploy).
# - Pushes to main deploy the static dist/ via actions/deploy-pages.
# - Docs build on Linux only; the Rust dual-OS matrix is unaffected.

name: web-guide

on:
  push:
    branches: [main]
    paths:
      - "web-guide/**"
      - ".github/workflows/web-guide.yml"
  pull_request:
    paths:
      - "web-guide/**"
      - ".github/workflows/web-guide.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-guide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-guide/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web-guide/playwright-report/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web-guide/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
