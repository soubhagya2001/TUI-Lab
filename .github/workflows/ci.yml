name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: fmt/clippy/test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tuilab
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    name: dogfood e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tuilab
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p tui-lab-cli
      - run: cargo build --manifest-path tests/fixtures/ratatui-sample/Cargo.toml
      - run: cargo run -p tui-lab-cli -- run tests/e2e --debug
      - run: cargo test -p tui-lab-mcp --test stdio_probe

  sdk-python:
    name: python sdk (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: cargo build -p tui-lab-cli
        working-directory: tuilab
      - run: uv run --with pytest python -m pytest tests/ -q
        working-directory: tuilab/sdks/python
