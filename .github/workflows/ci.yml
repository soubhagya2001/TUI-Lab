name: ci

# I5: Rust jobs ignore web-guide-only pushes (the web-guide workflow owns
# those paths); concurrency cancels stale runs on the same ref.
on:
  push:
    paths:
      - "tuilab/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - "Cargo.*"
  pull_request:
    paths:
      - "tuilab/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - "Cargo.*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt/clippy/test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # I1: macOS leg — aarch64-apple-darwin ships, so it tests.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tuilab
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuilab
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # I4: failure evidence, not just red logs.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rust-reports-${{ matrix.os }}
          path: tuilab/reports/
          retention-days: 7

  e2e:
    name: dogfood e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tuilab
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuilab
      - run: cargo build -p tui-lab-cli
      - run: cargo build --manifest-path tests/fixtures/ratatui-sample/Cargo.toml
      - run: cargo run -p tui-lab-cli -- run tests/e2e --debug
      - run: cargo run -p tui-lab-cli -- run tests/e2e --parallel 2
      - run: cargo test -p tui-lab-mcp --test stdio_probe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-reports-${{ matrix.os }}
          path: tuilab/reports/
          retention-days: 7

  schema:
    # I2: every committed YAML suite must satisfy the v1 JSON schema.
    name: suite schema gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          cache-enable: true
      - name: Validate suites against schema
        shell: bash
        run: |
          for suite in tuilab/tests/e2e/*.yaml; do
            echo "checking $suite"
            SUITE="$suite" uvx --with jsonschema --with pyyaml python -c "import json,jsonschema,os,yaml; schema=json.load(open('tuilab/schemas/test-schema-v1.json')); doc=yaml.safe_load(open(os.environ['SUITE'])); jsonschema.validate(doc,schema); print('ok:',os.environ['SUITE'])"
          done

  pack-gate:
    # K5: version drift and broken packing must fail on the PR, not on the
    # release. Publishes re-pack per platform; this job proves the scripts
    # and manifests still work, cheaply, on every change.
    name: version + pack gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuilab
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tuilab/sdks/javascript/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          cache-enable: true
      - name: Version lockstep check
        run: uv run python tuilab/pack/bump_versions.py --check
      - name: Build the engine the wheel embeds
        run: cargo build -p tui-lab-cli
        working-directory: tuilab
      - name: Pack the platform wheel
        run: |
          uv run --with build --with wheel python tuilab/sdks/python/pack/pack_wheel.py \
            --binary-dir tuilab/target/debug \
            --plat manylinux_x86_64 \
            --outdir "$RUNNER_TEMP/wheels"
      - name: Pack the JS SDK and npm launcher tarballs
        run: |
          cd tuilab/sdks/javascript && npm ci --no-audit --no-fund && npm pack --dry-run
          cd ../npm-cli && npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pack-gate-logs
          path: tuilab/sdks/*/dist/
          retention-days: 7

  sdk-python:
    name: python sdk (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuilab
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          cache-enable: true
      - run: cargo build -p tui-lab-cli
        working-directory: tuilab
      - run: uv run --with pytest python -m pytest tests/ -q
        working-directory: tuilab/sdks/python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sdk-python-reports-${{ matrix.os }}
          path: tuilab/sdks/python/reports/
          retention-days: 7

  sdk-js:
    name: js sdk (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuilab
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tuilab/sdks/javascript/package-lock.json
      - run: cargo build -p tui-lab-cli
        working-directory: tuilab
      - run: npm ci --no-audit --no-fund
        working-directory: tuilab/sdks/javascript
      - run: npm test
        working-directory: tuilab/sdks/javascript
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sdk-js-reports-${{ matrix.os }}
          path: tuilab/sdks/javascript/reports/
          retention-days: 7

  sdk-rust:
    # I1: the Rust SDK gets its own job (thin sidecar — ubuntu only; engine
    # coverage comes from the rust/e2e legs).
    name: rust sdk (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tuilab
      - run: cargo build -p tui-lab-cli
        working-directory: tuilab
      - run: cargo test -p tui-lab-sdk
        working-directory: tuilab
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sdk-rust-reports-ubuntu-latest
          path: tuilab/sdks/rust/reports/
          retention-days: 7
